# ==========================================
# Servidor HTTP (Azure App Service Linux / Local)
# ==========================================
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# ==========================================
# Swagger / OpenAPI
# ==========================================
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Raiz do Bem
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Projeto academico elaborado para o Challenge FIAP 2025-26

# ==========================================
# Banco de Dados (Oracle) & Pool Agroal
# ==========================================
quarkus.datasource.db-kind=oracle
quarkus.datasource.db-version=19.0

# Se as variaveis DB_* existirem (no Azure ou no .env local), usa elas.
# Se nao existirem, usa os defaults locais comentados que voce tinha:
quarkus.datasource.username=${DB_USUARIO:system}
quarkus.datasource.password=${DB_SENHA:}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}

# Nao aloca conexoes no boot para nao travar a subida
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.acquisition-timeout=5S
quarkus.datasource.jdbc.background-validation-interval=2M

# Timeouts curtos no driver JDBC da Oracle (evita segurar thread por 100s no Azure)
quarkus.datasource.jdbc.additional-jdbc-properties."oracle.net.CONNECT_TIMEOUT"=3000
quarkus.datasource.jdbc.additional-jdbc-properties."oracle.jdbc.ReadTimeout"=5000

# Desabilita health check do banco para nao derrubar container no Azure
quarkus.datasource.health.enabled=false

# ==========================================
# Hibernate ORM (Evita metadata lookup travando o boot)
# ==========================================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.dialect=org.hibernate.dialect.OracleDialect
quarkus.hibernate-orm.unsupported-properties."hibernate.temp.use_jdbc_metadata_defaults"=false
quarkus.hibernate-orm.unsupported-properties."hibernate.boot.allow_jdbc_metadata_access"=false

# ==========================================
# Clientes REST Externos
# ==========================================
quarkus.rest-client.via-cep-api.url=https://viacep.com.br/ws
quarkus.rest-client.google-maps-api.url=https://routes.googleapis.com
google-api-key=${GOOGLE_API_KEY:}

# ==========================================
# CORS
# ==========================================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:https://raiz-do-bem.vercel.app,https://raiz-do-bem-renans-projects-d48bb743.vercel.app,https://raiz-do-bem-git-main-renans-projects-d48bb743.vercel.app}
quarkus.http.cors.methods=GET,PUT,POST,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.http.cors.access-control-max-age=24H

# ==========================================
# Autenticacao JWT
# ==========================================
mp.jwt.verify.publickey.location=keyPublica.pem
mp.jwt.verify.issuer=raiz-do-bem
smallrye.jwt.sign.key.location=keyPrivada.pem

quarkus.http.auth.proactive=false
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth