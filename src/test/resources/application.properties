# ==============================================================================
# CONFIGURAÇÃO DE TESTES ISOLADOS (FASE I-0) — FAIL-CLOSED
# ==============================================================================
# Propriedades aplicadas a execuções de teste para garantir isolamento absoluto
# contra banco de dados real e serviços externos na inicialização do Quarkus.

# 1. Banco de Dados: Apontamento estrito para loopback inválido (Porta 1 = TCP RST)
quarkus.datasource.jdbc.url=jdbc:oracle:thin:@//127.0.0.1:1/FAIL_CLOSED_TEST
%test.quarkus.datasource.jdbc.url=jdbc:oracle:thin:@//127.0.0.1:1/FAIL_CLOSED_TEST
quarkus.datasource.username=test_isolated
%test.quarkus.datasource.username=test_isolated
quarkus.datasource.password=test_isolated
%test.quarkus.datasource.password=test_isolated

# 2. Desativação explícita de Dev Services (impede que o Quarkus inicie containers)
quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=false

# 3. Pool Agroal e Timeouts Curtos (não abre conexões no boot)
quarkus.datasource.jdbc.initial-size=0
%test.quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.min-size=0
%test.quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.acquisition-timeout=1S
%test.quarkus.datasource.jdbc.acquisition-timeout=1S
quarkus.datasource.health.enabled=false
%test.quarkus.datasource.health.enabled=false
quarkus.datasource.jdbc.additional-jdbc-properties."oracle.net.CONNECT_TIMEOUT"=1000
%test.quarkus.datasource.jdbc.additional-jdbc-properties."oracle.net.CONNECT_TIMEOUT"=1000
quarkus.datasource.jdbc.additional-jdbc-properties."oracle.jdbc.ReadTimeout"=1000
%test.quarkus.datasource.jdbc.additional-jdbc-properties."oracle.jdbc.ReadTimeout"=1000

# 4. Hibernate ORM: Bloqueio estrito de DDL e de leitura de metadados JDBC no boot
quarkus.hibernate-orm.database.generation=none
%test.quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.strategy=none
%test.quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.validate-in-dev-mode=false
%test.quarkus.hibernate-orm.validate-in-dev-mode=false
quarkus.hibernate-orm.unsupported-properties."hibernate.temp.use_jdbc_metadata_defaults"=false
%test.quarkus.hibernate-orm.unsupported-properties."hibernate.temp.use_jdbc_metadata_defaults"=false
quarkus.hibernate-orm.unsupported-properties."hibernate.boot.allow_jdbc_metadata_access"=false
%test.quarkus.hibernate-orm.unsupported-properties."hibernate.boot.allow_jdbc_metadata_access"=false

# 5. Clientes REST: Loopback nos prefixos reais do projeto
quarkus.rest-client.via-cep-api.url=http://127.0.0.1:1/viacep-failclosed
%test.quarkus.rest-client.via-cep-api.url=http://127.0.0.1:1/viacep-failclosed
quarkus.rest-client.google-maps-api.url=http://127.0.0.1:1/google-failclosed
%test.quarkus.rest-client.google-maps-api.url=http://127.0.0.1:1/google-failclosed
google-api-key=CHAVE_TESTE_ISOLADO
%test.google-api-key=CHAVE_TESTE_ISOLADO

# 6. Autenticação JWT: Chaves exclusivas de teste (isolamento total das chaves de produção)
mp.jwt.verify.publickey.location=testKeyPublica.pem
%test.mp.jwt.verify.publickey.location=testKeyPublica.pem
smallrye.jwt.sign.key.location=testKeyPrivada.pem
%test.smallrye.jwt.sign.key.location=testKeyPrivada.pem
mp.jwt.verify.issuer=raiz-do-bem
%test.mp.jwt.verify.issuer=raiz-do-bem
